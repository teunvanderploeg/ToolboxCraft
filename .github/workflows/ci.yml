name: Rust checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify release signing safeguards
        if: runner.os == 'Linux'
        run: python -m unittest discover -s packaging -p 'test_*.py'
      - run: cargo build --workspace --locked
      - name: Linux GUI smoke test
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run target/debug/toolboxcraft --preview --screenshot preview.png
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: preview.png
