name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signing:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check stable release version
        run: python packaging/release_version.py
      - name: Verify release signing configuration
        run: python packaging/manifest.py --check-signing-key
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TOOLBOXCRAFT_UPDATE_PRIVATE_KEY }}
      - name: Require trusted platform signing for published releases
        if: github.ref_type == 'tag'
        run: python packaging/signing.py
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
  package:
    needs: signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, platform: macos-universal, target: aarch64-apple-darwin }
          - { runner: windows-2022, platform: windows-x64, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, platform: windows-arm64, target: aarch64-pc-windows-msvc }
          - { runner: ubuntu-22.04, platform: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    env:
      TOOLBOXCRAFT_RELEASE_REPO: ${{ github.repository }}
      REQUIRE_DISTRIBUTION_SIGNING: ${{ github.ref_type == 'tag' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libfuse2
          ARCH=$(uname -m)
          curl --fail --location https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$ARCH.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          TC_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          TC_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TC_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TC_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          TC_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [[ -n "$TC_CERTIFICATE" ]]; then
            python - <<'PYTHON'
          import os, base64, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'toolboxcraft.p12').write_bytes(base64.b64decode(os.environ['TC_CERTIFICATE']))
          PYTHON
            TC_KEYCHAIN_PASSWORD=$(uuidgen)
            security create-keychain -p "$TC_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/toolboxcraft.keychain-db"
            security unlock-keychain -p "$TC_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/toolboxcraft.keychain-db"
            security import "$RUNNER_TEMP/toolboxcraft.p12" -k "$RUNNER_TEMP/toolboxcraft.keychain-db" -P "$TC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$TC_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/toolboxcraft.keychain-db"
            security list-keychains -d user -s "$RUNNER_TEMP/toolboxcraft.keychain-db" login.keychain-db
            rm "$RUNNER_TEMP/toolboxcraft.p12"
          fi
          if [[ -n "$TC_APPLE_ID" ]]; then
            xcrun notarytool store-credentials ToolboxCraftNotary --apple-id "$TC_APPLE_ID" --team-id "$TC_TEAM_ID" --password "$TC_NOTARY_PASSWORD"
            echo 'MACOS_NOTARY_PROFILE=ToolboxCraftNotary' >> "$GITHUB_ENV"
          fi
      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TC_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ($env:TC_CERTIFICATE) {
            $tcCertPath = Join-Path $env:RUNNER_TEMP 'toolboxcraft.pfx'
            [IO.File]::WriteAllBytes($tcCertPath, [Convert]::FromBase64String($env:TC_CERTIFICATE))
            Add-Content $env:GITHUB_ENV "WINDOWS_SIGN_PFX=$tcCertPath"
            $tcTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object { $_.DirectoryName -match '\\x64$' } | Sort-Object FullName -Descending | Select-Object -First 1
            Add-Content $env:GITHUB_PATH $tcTool.DirectoryName
          }
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --workspace --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal/release
          for BIN in toolboxcraft toolboxcraft-updater; do
            lipo -create target/aarch64-apple-darwin/release/$BIN target/x86_64-apple-darwin/release/$BIN -output target/universal/release/$BIN
          done
      - name: Package
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])'); fi
          DIR=target/${{ matrix.target }}/release
          if [[ '${{ matrix.platform }}' == macos-universal ]]; then DIR=target/universal/release; fi
          python packaging/package.py --platform '${{ matrix.platform }}' --version "$VERSION" --bin-dir "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
  assemble:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - run: python packaging/manifest.py --require-signature --require-all-platforms
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TOOLBOXCRAFT_UPDATE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
      - name: Publish signed release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$DRAFT" != true ]]; then
              echo 'This release is already published; publish a new version instead of replacing it.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "ToolboxCraft ${RELEASE_TAG#v}" --notes-file packaging/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
