[workspace]
members = ["crates/core", "crates/platform", "apps/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
directories = "6"
sysinfo = "0.37"
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
